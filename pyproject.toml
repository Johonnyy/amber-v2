[project]
name = "amber"
version = "0.1.0"
description = "Amber — a cloud-hosted personal AI voice backend. Phase 5: polish & reliability."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # STT (Whisper) + TTS. The *brain* no longer uses this directly — it goes
    # through agent-runtime to OpenRouter.
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # HTTP client for the inline web_search tool.
    "httpx>=0.27",
    # IANA tz database for zoneinfo — needed for AMBER_TIMEZONE on systems without a
    # system tz db (e.g. Windows); harmless where one exists.
    "tzdata>=2024.1",
    # The shared agentic loop. Replaces the hand-rolled Anthropic tool loop that
    # used to live in app/brain.py, which is why `anthropic` is no longer a
    # dependency here. The [mcp] extra brings the MCP SDK so Amber can call other
    # apps' servers as a client.
    "agent-runtime[mcp] @ git+https://github.com/Johonnyy/agent-runtime@9621f42",
    # The convention layer for Amber's own MCP server, so other agents and
    # Aperture can query her memory, tasks, and reminders.
    "agent-mcp-py @ git+https://github.com/Johonnyy/agent-mcp-py@01b7493",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
